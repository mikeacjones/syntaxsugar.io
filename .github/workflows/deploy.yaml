name: Deploy

on:
  workflow_dispatch:
  # Courses are pulled from their own repos at build time. Rebuild daily to pick
  # up their changes, or right away when a course repo sends a course-updated event.
  schedule:
    - cron: '0 9 * * *'
  repository_dispatch:
    types: [course-updated]
  push:
    branches: master
    paths-ignore:
      - README.md
      - .github/workflows/deploy.yaml
      - .github/workflows/deploy-preview.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: dist
          clean: true
